<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comment Manager</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#182033;font-family:Inter,"Noto Sans KR",sans-serif}.wrap{width:min(900px,100%);margin:auto;padding:30px 18px}.head{display:flex;justify-content:space-between;align-items:center}.panel{background:#fff;border:1px solid #e5e8ef;border-radius:14px;padding:20px;margin-top:18px}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid #dfe3ec;border-radius:9px;padding:10px;outline:none}textarea{min-height:100px;resize:vertical}button{border:1px solid #dfe3ec;background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.primary{background:#5865f2;color:#fff;border-color:#5865f2}.danger{color:#d84d4d}.like{color:#b77d00}.form{display:grid;gap:9px}.muted{color:#7b8498;font-size:13px}.comment{padding:16px 0;border-bottom:1px solid #edf0f5}.comment:last-child{border-bottom:0}.topline{display:flex;justify-content:space-between}.body{white-space:pre-wrap;line-height:1.6;margin:8px 0}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:12px;padding:6px 9px}.empty{text-align:center;color:#7b8498;padding:35px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modalbox{width:min(520px,100%);background:#fff;border-radius:14px;padding:20px}.modalhead{display:flex;justify-content:space-between}</style></head><body><div class="wrap"><div class="head"><div><h1>💬 Comment Manager</h1><div class="muted">Daily ID를 기준으로 댓글 API를 관리합니다.</div></div><button onclick="location.href='daily.html'">Daily로</button></div><div class="panel"><div class="form"><label>JWT</label><input id="token" placeholder="daily.html 로그인 토큰"><label>Daily ID</label><input id="dailyId" type="number" min="1" placeholder="예: 1"><button class="primary" onclick="loadComments()">댓글 조회</button></div></div><div id="list" class="panel"><div class="empty">Daily ID를 입력하세요.</div></div></div><div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2>댓글 수정</h2><button onclick="closeModal()">×</button></div><div id="mb"></div></div></div><script>
const API='http://localhost:8080';let token=localStorage.getItem('dailyJwt')||'',dailyId=null,comments=[];document.getElementById('token').value=token;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const val=id=>document.getElementById(id).value.trim();
async function api(path,opt={}){let t=document.getElementById('token').value.trim(),r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(t?{Authorization:t}:{}),...(opt.headers||{})}});let x=await r.text(),b;try{b=x?JSON.parse(x):null}catch{b=x}if(!r.ok)throw Error(typeof b==='string'?b:(b?.data||`HTTP ${r.status}`));return b}
async function loadComments(){dailyId=val('dailyId');if(!dailyId)return alert('Daily ID를 입력하세요.');try{let r=await api('/api/comments/'+dailyId);comments=r.data||[];render()}catch(e){list.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function render(){if(!comments.length){list.innerHTML='<div class="empty">댓글이 없습니다.</div>';return}list.innerHTML=comments.map(c=>`<div class="comment"><div class="topline"><b>${esc(c.author)}</b><span class="muted">${c.modifiedAt||c.createdAt||''}</span></div><div class="body">${esc(c.content)}</div><div class="actions"><span class="muted">❤️ ${c.likes??0}</span><button class="like" onclick="like(${c.commentId})">좋아요</button><button onclick="edit(${c.commentId})">수정</button><button class="danger" onclick="del(${c.commentId})">삭제</button></div></div>`).join('')}
function openModal(html){document.getElementById('mb').innerHTML=html;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
function edit(id){let c=comments.find(x=>x.commentId===id);if(!c)return;openModal(`<div class="form"><label>내용</label><textarea id="content" maxlength="100">${esc(c.content)}</textarea><label>비밀번호</label><input id="pw" type="password"><button class="primary" onclick="update(${id})">수정</button></div>`)}
async function update(id){try{await api('/api/comments/'+id,{method:'PATCH',body:JSON.stringify({content:val('content'),password:val('pw')})});closeModal();await loadComments()}catch(e){alert(e.message)}}
async function del(id){let pw=prompt('댓글 비밀번호');if(pw===null)return;try{await api('/api/comments/'+id,{method:'DELETE',body:JSON.stringify({password:pw})});await loadComments()}catch(e){alert(e.message)}}
async function like(id){try{await api('/api/comments/'+id+'/likes',{method:'POST'});await loadComments()}catch(e){alert(e.message)}}
</script></body></html>
