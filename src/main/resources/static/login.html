<!doctype html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width,initial-scale=1">

    <title>Dailog | 로그인</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dailog-pastel-theme.css">
</head>

<body>

<main class="auth-page">

    <section class="auth-card">

        <h1>Dailog</h1>

        <p class="muted">
            일상을 기록하고 이야기를 나눠보세요.
        </p>

        <form id="loginForm">

            <label>
                이메일

                <input
                        id="email"
                        type="email"
                        autocomplete="email"
                        required>
            </label>

            <label>
                비밀번호

                <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        required>
            </label>

            <button
                    class="primary"
                    type="submit">
                로그인
            </button>

        </form>

        <p
                id="message"
                class="message">
        </p>

        <a href="signup.html">
            회원가입
        </a>

    </section>

</main>

<script src="js/common.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
